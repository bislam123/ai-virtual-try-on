# Reference reverse-proxy config -- NOT active anywhere, no TLS
# certificate exists yet, no domain is provisioned. An operator copies
# this, fills in the placeholders, and obtains a real certificate (e.g.
# via certbot/Let's Encrypt) before using it. See docs/DEPLOYMENT.md
# section 7 for the full reasoning behind every directive below.
#
# This app has no WebSocket usage anywhere -- job status is plain HTTP
# polling (GET /api/try-on/{id}), not a persistent connection -- so no
# `Upgrade`/`Connection: upgrade` proxy config is included. Add it only
# if a future milestone genuinely introduces WebSocket/SSE traffic.

# --- Plain HTTP: redirect to HTTPS only, nothing else served here -----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example.com;

    # --- TLS termination ------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS -- only once this TLS config is actually live and verified
    # working end to end (see docs/DEPLOYMENT.md: sending HSTS before
    # HTTPS is genuinely, permanently in place would be actively wrong,
    # not cautious -- the application itself deliberately never sends
    # this header for the same reason, see core/security_headers.py).
    # Uncomment only after confirming HTTPS works:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Request body limit, mirrored at the proxy layer -----------------------
    # Matches (slightly above) AITRYON_MAX_REQUEST_BODY_BYTES's 25 MiB
    # default -- see docs/DEPLOYMENT.md section 12: keep the proxy's limit
    # >= the application's so this layer doesn't silently truncate a
    # request the application would otherwise reject cleanly with a
    # proper 413. If AITRYON_MAX_REQUEST_BODY_BYTES is ever changed,
    # update this alongside it.
    client_max_body_size 26M;

    # --- API: reverse-proxied to the backend, with real client IPs -------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Real client IP -- required alongside uvicorn's own
        # --proxy-headers --forwarded-allow-ips=<this proxy's IP> (see
        # docs/DEPLOYMENT.md section 12/5). Without both sides configured,
        # every request's client.host collapses to this proxy's own
        # address, breaking rate limiting/anonymous quota/idempotency
        # scoping -- a self-inflicted availability bug, not a security
        # hole, but a real one.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous, not the application's own bound -- a legitimate
        # generation can poll for a long time, but each individual poll
        # request itself is fast; this just avoids the proxy timing out
        # an otherwise-healthy long-lived connection reuse.
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # No X-Forwarded-For needed here -- health checks aren't
        # identity-scoped by anything this app does.
        access_log off;
    }

    # --- Frontend: the static Vite build (frontend/dist/ after `npm run
    # build`), served directly by this proxy -- not part of the backend
    # Docker image (see Dockerfile's own docstring). Point root at
    # wherever that build output actually lives on this host, or replace
    # this whole block with a reverse-proxy to a separate static host/CDN.
    location / {
        root /var/www/aitryon-frontend;
        try_files $uri /index.html;
    }
}
