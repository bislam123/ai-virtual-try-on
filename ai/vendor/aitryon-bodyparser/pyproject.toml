[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aitryon-bodyparser"
version = "0.1.0"
description = "AI Try-On's commercially-clean stand-in for a body/garment segmentation model."
license = { text = "MIT" }
authors = [{ name = "AI Try-On project" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21.0"]

[tool.setuptools.packages.find]
where = ["src"]
